const de=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const a64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function descifrar(bruta){
  const k=await crypto.subtle.importKey("raw",bruta,"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:de(IV)},k,de(DATOS)));
}
function mostrar(html){
  // Sustituye la página entera por el panel (sin document.write, que en algunos navegadores lo añade debajo)
  const d=new DOMParser().parseFromString(html,"text/html");
  document.replaceChild(document.adoptNode(d.documentElement),document.documentElement);
  // Los scripts insertados así no se ejecutan solos: se recrean para que corran (navegación del panel)
  document.querySelectorAll('script:not([type="application/json"])').forEach(s=>{
    const n=document.createElement("script");n.textContent=s.textContent;s.replaceWith(n);});
}
async function derivar(clave){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:de(SAL),iterations:ITER},base,256);
}
(async()=>{let g=null;try{g=localStorage.getItem(LLAVE)}catch(_){}
  if(!g)return;let html;
  try{html=await descifrar(de(g))}catch(_){try{localStorage.removeItem(LLAVE)}catch(_){}return;}
  mostrar(html);})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e");
  b.disabled=true;b.textContent="Comprobando…";e.textContent="";
  let bruta,html;
  try{bruta=await derivar(document.getElementById("c").value);html=await descifrar(bruta);}
  catch(_){e.textContent="Contraseña incorrecta.";b.disabled=false;b.textContent="Entrar";return;}
  if(document.getElementById("r").checked){try{localStorage.setItem(LLAVE,a64(bruta))}catch(_){}}
  try{mostrar(html)}catch(err){e.textContent="No se pudo mostrar el panel: "+err.message;b.disabled=false;b.textContent="Entrar";}
});
